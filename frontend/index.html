<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>랜덤 채팅 | chat.funnyfunny.cloud</title>
    <meta
      name="description"
      content="익명으로 무작위 상대와 1:1 채팅. 가볍게 대화해보세요."
    />
    <link rel="canonical" href="https://chat.funnyfunny.cloud/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chat.funnyfunny.cloud/" />
    <meta property="og:title" content="랜덤 채팅" />
    <meta property="og:description" content="익명으로 무작위 상대와 1:1 채팅" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e293b'/><path d='M30 45 L45 45 L55 55 L70 55' stroke='%2394a3b8' stroke-width='4' fill='none' stroke-linecap='round'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0c0a1d;
        --bg-card: rgba(30, 27, 75, 0.6);
        --border: rgba(139, 92, 246, 0.2);
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #a78bfa;
        --accent-bright: #c4b5fd;
        --success: #34d399;
        --warn: #fbbf24;
        --error: #f87171;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Noto Sans KR",
          sans-serif;
        background: radial-gradient(
            ellipse 80% 50% at 50% -20%,
            rgba(139, 92, 246, 0.25),
            transparent
          ),
          radial-gradient(
            ellipse 60% 40% at 100% 100%,
            rgba(59, 130, 246, 0.15),
            transparent
          ),
          var(--bg);
        color: var(--text);
        min-height: 100vh;
        line-height: 1.5;
      }
      .wrap {
        max-width: 420px;
        margin: 0 auto;
        padding: 28px 20px 120px;
      }
      header {
        text-align: center;
        margin-bottom: 32px;
      }
      .logo {
        font-size: 2.5rem;
        margin-bottom: 8px;
        filter: drop-shadow(0 0 20px rgba(167, 139, 250, 0.3));
      }
      h1 {
        margin: 0 0 6px;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .tagline {
        margin: 0;
        font-size: 0.9rem;
        color: var(--muted);
        font-weight: 400;
      }
      .kindness {
        text-align: center;
        font-size: 0.85rem;
        color: var(--muted);
        margin: 0 0 20px;
        padding: 12px 16px;
        background: rgba(52, 211, 153, 0.08);
        border: 1px solid rgba(52, 211, 153, 0.2);
        border-radius: 12px;
        line-height: 1.5;
      }

      .start-card {
        background: var(--bg-card);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px 24px;
        text-align: center;
        margin-bottom: 20px;
      }
      .start-card p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .btn-match {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 16px 24px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent) 0%, #7c3aed 100%);
        color: white;
        font-family: inherit;
        font-size: 1.05rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.2s;
      }
      .btn-match:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 24px rgba(139, 92, 246, 0.4);
      }
      .btn-match:active {
        transform: translateY(0);
      }
      .btn-match:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .status {
        padding: 14px 18px;
        border-radius: 14px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        margin-bottom: 16px;
        font-size: 0.9rem;
        text-align: center;
      }
      .status.waiting {
        color: var(--warn);
      }
      .status.matched {
        color: var(--success);
      }
      .status.disconnected {
        color: var(--error);
      }

      .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .chat-header-text {
        font-size: 0.9rem;
        color: var(--muted);
      }
      .btn-report {
        padding: 6px 12px;
        border: 1px solid rgba(248, 113, 113, 0.4);
        border-radius: 8px;
        background: rgba(248, 113, 113, 0.1);
        color: var(--error);
        font-size: 0.8rem;
        cursor: pointer;
      }
      .btn-report:hover {
        background: rgba(248, 113, 113, 0.2);
      }
      .btn-report.reported {
        opacity: 0.6;
        cursor: default;
      }

      .chat-area {
        min-height: 300px;
        max-height: 45vh;
        overflow-y: auto;
        padding: 20px;
        background: var(--bg-card);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 20px;
        margin-bottom: 16px;
      }
      .chat-area::-webkit-scrollbar {
        width: 6px;
      }
      .chat-area::-webkit-scrollbar-track {
        background: transparent;
      }
      .chat-area::-webkit-scrollbar-thumb {
        background: rgba(139, 92, 246, 0.3);
        border-radius: 3px;
      }
      .msg {
        margin-bottom: 14px;
        max-width: 85%;
        animation: fadeIn 0.25s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .msg.self {
        margin-left: auto;
        text-align: right;
      }
      .msg .bubble {
        display: inline-block;
        padding: 12px 16px;
        border-radius: 18px;
        font-size: 0.95rem;
        line-height: 1.45;
      }
      .msg.self .bubble {
        background: linear-gradient(135deg, var(--accent) 0%, #7c3aed 100%);
        color: white;
        border-bottom-right-radius: 6px;
      }
      .msg.other .bubble {
        background: rgba(51, 65, 85, 0.8);
        border: 1px solid var(--border);
        border-bottom-left-radius: 6px;
      }
      .msg .ts {
        font-size: 0.7rem;
        color: var(--muted);
        margin-top: 6px;
      }

      .input-row {
        display: flex;
        gap: 10px;
      }
      .input-row input {
        flex: 1;
        padding: 14px 18px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--bg-card);
        color: var(--text);
        font-family: inherit;
        font-size: 1rem;
      }
      .input-row input::placeholder {
        color: var(--muted);
      }
      .input-row input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
      }
      .input-row button {
        padding: 14px 20px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent) 0%, #7c3aed 100%);
        color: white;
        font-weight: 600;
        cursor: pointer;
        font-size: 1rem;
      }
      .input-row button:hover {
        opacity: 0.95;
      }
      .input-row button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-next {
        width: 100%;
        padding: 14px;
        margin-top: 16px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--bg-card);
        color: var(--text);
        font-family: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-next:hover {
        background: rgba(139, 92, 246, 0.15);
      }

    footer {
        text-align: center;
        padding: 24px;
      }
      .footer-link {
        color: var(--accent);
        text-decoration: none;
        font-size: 0.9rem;
      }
      .footer-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="logo">💬</div>
        <h1>랜덤 채팅</h1>
        <p class="tagline">익명으로 무작위 상대와 1:1 대화</p>
      </header>

      <p class="kindness">
        ✨ 상처 주는 말보다 긍정적이고 착한 대화를 나누면,<br />
        본인에게도 복이 돌아온답니다.
      </p>

      <div id="startCard" class="start-card">
        <p>
          누군가와 대화하고 싶을 때,<br />버튼을 누르면 랜덤으로 매칭됩니다.
        </p>
        <button type="button" id="matchBtn" class="btn-match">
          🎲 매칭 하기
        </button>
      </div>

      <div id="status" class="status" style="display: none"></div>
      <div id="chatHeader" class="chat-header" style="display: none">
        <span class="chat-header-text">대화 중</span>
        <button
          type="button"
          id="reportBtn"
          class="btn-report"
          title="부적절한 대화 신고"
        >
          ⚠️ 신고하기
        </button>
      </div>
      <div id="chatArea" class="chat-area" style="display: none"></div>
      <div id="inputRow" class="input-row" style="display: none">
        <input
          type="text"
          id="input"
          placeholder="메시지 입력"
          maxlength="500"
          autocomplete="off"
        />
        <button type="button" id="sendBtn">전송</button>
      </div>
      <button type="button" id="nextBtn" class="btn-next" style="display: none">
        다른 상대 찾기
      </button>

  </div>

  <footer>
      <a
        href="https://funnyfunny.cloud"
        target="_blank"
        rel="noopener"
        class="footer-link"
        >✨ 다른 서비스 보기</a
      >
    </footer>

    <script src="config.js"></script>
    <script>
      (function () {
        const statusEl = document.getElementById("status");
        const startCard = document.getElementById("startCard");
        const matchBtn = document.getElementById("matchBtn");
        const chatArea = document.getElementById("chatArea");
        const inputRow = document.getElementById("inputRow");
        const input = document.getElementById("input");
        const sendBtn = document.getElementById("sendBtn");
        const nextBtn = document.getElementById("nextBtn");
        const chatHeader = document.getElementById("chatHeader");
        const reportBtn = document.getElementById("reportBtn");
        let ws = null;
        let matched = false;
        let intentionalReconnect = false;
        let messageHistory = [];

        function log(msg, type) {
          type = type || "info";
          const prefix = "[chat]";
          if (type === "err") console.error(prefix, msg);
          else if (type === "warn") console.warn(prefix, msg);
          else console.log(prefix, msg);
        }

        function escapeHtml(s) {
          const d = document.createElement("div");
          d.textContent = s;
          return d.innerHTML;
        }

        function setStatus(text, klass) {
          statusEl.textContent = text;
          statusEl.className = "status " + (klass || "");
          statusEl.style.display = "block";
        }

        function hideStatus() {
          statusEl.style.display = "none";
        }

        function addMsg(text, isSelf, ts) {
          chatArea.style.display = "block";
          messageHistory.push({ text, isSelf, ts: ts || Date.now() });
          if (messageHistory.length > 30) messageHistory.shift();
          const div = document.createElement("div");
          div.className = "msg " + (isSelf ? "self" : "other");
          const time = ts
            ? new Date(ts).toLocaleTimeString("ko-KR", {
                hour: "2-digit",
                minute: "2-digit",
              })
            : "";
          div.innerHTML =
            '<div class="bubble">' +
            escapeHtml(text) +
            '</div><div class="ts">' +
            time +
            "</div>";
          chatArea.appendChild(div);
          chatArea.scrollTop = chatArea.scrollHeight;
        }

        function connect() {
          if (ws && ws.readyState === 1) return;
          matched = false;
          startCard.style.display = "none";
          nextBtn.style.display = "none";
          setStatus("매칭 중...", "waiting");
          chatArea.style.display = "none";
          chatArea.innerHTML = "";
          chatHeader.style.display = "none";
          inputRow.style.display = "none";
          messageHistory = [];
          reportBtn.classList.remove("reported");

          const url =
            typeof getWsUrl === "function"
              ? getWsUrl()
              : "wss://chat-jz6r.onrender.com/ws";
          log("Connecting to " + url, "info");

          try {
            ws = new WebSocket(url);
          } catch (e) {
            log("WebSocket constructor error: " + e.message, "err");
            setStatus("연결 실패: " + e.message, "disconnected");
            startCard.style.display = "block";
            matchBtn.disabled = false;
            return;
          }

          ws.onopen = () => {
            log("WebSocket OPEN (readyState=" + ws.readyState + ")", "ok");
            setStatus("매칭 중...", "waiting");
          };

          ws.onmessage = (e) => {
            try {
              log("RECV: " + e.data, "info");
              const msg = JSON.parse(e.data);
              if (msg.type === "waiting") {
                setStatus("매칭 중...", "waiting");
              } else if (msg.type === "matched") {
                matched = true;
                messageHistory = [];
                log("Matched with partner", "ok");
                setStatus("상대와 연결됐어요", "matched");
                chatHeader.style.display = "flex";
                inputRow.style.display = "flex";
                input.focus();
              } else if (msg.type === "chat") {
                addMsg(msg.text || "", false, msg.ts);
              } else if (msg.type === "partner_left") {
                log("Partner left", "warn");
                setStatus("상대가 나갔어요", "disconnected");
                chatHeader.style.display = "none";
                inputRow.style.display = "none";
                nextBtn.style.display = "block";
              } else {
                log("Unknown msg type: " + (msg.type || "null"), "warn");
              }
            } catch (err) {
              log("Parse error: " + err.message + " raw=" + e.data, "err");
            }
          };

          ws.onclose = (e) => {
            log(
              "WebSocket CLOSE code=" +
                e.code +
                " reason=" +
                (e.reason || "") +
                " clean=" +
                e.wasClean,
              e.wasClean ? "info" : "err",
            );
            if (!intentionalReconnect) {
              setStatus(
                "연결 끊김. (코드: " +
                  e.code +
                  ") 새로고침 또는 매칭 하기를 눌러주세요.",
                "disconnected",
              );
              chatHeader.style.display = "none";
              inputRow.style.display = "none";
              nextBtn.style.display = "block";
              startCard.style.display = "block";
              matchBtn.disabled = false;
            }
          };

          ws.onerror = (e) => {
            log("WebSocket ERROR", "err");
            setStatus("연결 오류. 디버그 로그를 확인해주세요.", "disconnected");
          };
        }

        function send() {
          const text = (input.value || "").trim();
          if (!text || !ws || ws.readyState !== 1 || !matched) return;
          const payload = JSON.stringify({ type: "chat", text: text });
          ws.send(payload);
          log("SEND: " + payload, "info");
          addMsg(text, true, Date.now());
          input.value = "";
        }

        matchBtn.addEventListener("click", () => {
          matchBtn.disabled = true;
          log("Match button clicked", "info");
          connect();
        });

        sendBtn.addEventListener("click", send);
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            send();
          }
        });

        nextBtn.addEventListener("click", () => {
          intentionalReconnect = true;
          log("Next partner requested", "info");
          if (ws) {
            ws.close();
            ws = null;
          }
          intentionalReconnect = false;
          nextBtn.style.display = "none";
          startCard.style.display = "block";
          matchBtn.disabled = false;
          hideStatus();
        });

        reportBtn.addEventListener("click", () => {
          if (reportBtn.classList.contains("reported")) return;
          if (!ws || ws.readyState !== 1 || !matched) return;
          const recent = messageHistory
            .slice(-20)
            .map((m) => (m.isSelf ? "[나] " : "[상대] ") + m.text);
          ws.send(
            JSON.stringify({
              type: "report",
              reason: "부적절한 대화",
              recentMessages: recent,
            }),
          );
        reportBtn.classList.add("reported");
        reportBtn.textContent = "신고됨";
        log("Report sent", "ok");
      });

      log('Ready. Click "매칭 하기" to start.', "ok");
      })();
    </script>
  </body>
</html>
