<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Random Chat | chat.funnyfunny.cloud</title>
    <meta
      name="description"
      content="1:1 anonymous chat with random strangers. Start a conversation."
    />
    <link rel="canonical" href="https://chat.funnyfunny.cloud/en.html" />
    <link rel="alternate" hreflang="ko" href="https://chat.funnyfunny.cloud/" />
    <link rel="alternate" hreflang="en" href="https://chat.funnyfunny.cloud/en.html" />
    <link rel="alternate" hreflang="x-default" href="https://chat.funnyfunny.cloud/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chat.funnyfunny.cloud/en.html" />
    <meta property="og:title" content="Random Chat" />
    <meta property="og:description" content="1:1 anonymous chat with random strangers" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e293b'/><path d='M30 45 L45 45 L55 55 L70 55' stroke='%2394a3b8' stroke-width='4' fill='none' stroke-linecap='round'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root{--bg:#0c0a1d;--bg-card:rgba(30,27,75,.6);--border:rgba(139,92,246,.2);--text:#f8fafc;--muted:#94a3b8;--accent:#a78bfa;--success:#34d399;--warn:#fbbf24;--error:#f87171}
      *,*::before,*::after{box-sizing:border-box}
      body{margin:0;font-family:"Outfit",-apple-system,sans-serif;background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(139,92,246,.25),transparent),radial-gradient(ellipse 60% 40% at 100% 100%,rgba(59,130,246,.15),transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
      .wrap{max-width:420px;margin:0 auto;padding:28px 20px 120px}
      header{text-align:center;margin-bottom:32px}
      .logo{font-size:2.5rem;margin-bottom:8px}
      h1{margin:0 0 6px;font-size:1.5rem;font-weight:600}
      .tagline{margin:0;font-size:.9rem;color:var(--muted)}
      .kindness{text-align:center;font-size:.85rem;color:var(--muted);margin:0 0 20px;padding:12px 16px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2);border-radius:12px;line-height:1.5}
      .start-card{background:var(--bg-card);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:20px;padding:32px 24px;text-align:center;margin-bottom:20px}
      .start-card p{margin:0 0 24px;color:var(--muted);font-size:.95rem}
      .btn-match{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px 24px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;font-family:inherit;font-size:1.05rem;font-weight:600;cursor:pointer}
      .btn-match:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(139,92,246,.4)}
      .btn-match:disabled{opacity:.6;cursor:not-allowed;transform:none}
      .status{padding:18px 24px;border-radius:14px;background:var(--bg-card);border:1px solid var(--border);margin-bottom:16px;font-size:.9rem;text-align:center}
      .status.waiting{color:var(--warn);display:flex;align-items:center;justify-content:center;gap:16px;min-height:56px}
      .spinner{display:inline-block;vertical-align:-11px;width:32px;height:32px;flex-shrink:0;margin-right:10px;border:3px solid rgba(148,163,184,.3);border-top-color:#94a3b8;border-radius:50%;animation:spin 1.2s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .status.matched{color:var(--success)}.status.disconnected{color:var(--error)}
      .chat-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
      .chat-header-text{font-size:.9rem;color:var(--muted)}
      .btn-report{padding:6px 12px;border:1px solid rgba(248,113,113,.4);border-radius:8px;background:rgba(248,113,113,.1);color:var(--error);font-size:.8rem;cursor:pointer}
      .btn-report.reported{opacity:.6;cursor:default}
      .chat-area{min-height:300px;max-height:45vh;overflow-y:auto;padding:20px;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;margin-bottom:16px}
      .msg{margin-bottom:14px;max-width:85%}
      .msg.self{margin-left:auto;text-align:right}
      .msg .bubble{display:inline-block;padding:12px 16px;border-radius:18px;font-size:.95rem}
      .msg.self .bubble{background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;border-bottom-right-radius:6px}
      .msg.other .bubble{background:rgba(51,65,85,.8);border:1px solid var(--border);border-bottom-left-radius:6px}
      .msg .ts{font-size:.7rem;color:var(--muted);margin-top:6px}
      .input-row{display:flex;gap:10px}
      .input-row input{flex:1;padding:14px 18px;border:1px solid var(--border);border-radius:14px;background:var(--bg-card);color:var(--text);font-size:1rem}
      .input-row button{padding:14px 20px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;font-weight:600;cursor:pointer}
      .btn-next{width:100%;padding:14px;margin-top:16px;border:1px solid var(--border);border-radius:14px;background:var(--bg-card);color:var(--text);font-weight:600;cursor:pointer}
      footer{text-align:center;padding:24px}
      .footer-link{color:var(--accent);text-decoration:none}
      .lang-switch{position:fixed;top:12px;right:12px;z-index:100;padding:8px 14px;border-radius:8px;background:var(--bg-card);border:1px solid var(--border);color:var(--accent);font-size:.85rem;text-decoration:none}
    </style>
  </head>
  <body data-lang="en">
    <a href="./" class="lang-switch" id="langSwitch">🇰🇷 한국어</a>
    <div class="wrap">
      <header>
        <div class="logo">💬</div>
        <h1 data-i18n="title">Random Chat</h1>
        <p class="tagline" data-i18n="tagline">1:1 anonymous chat with random strangers</p>
      </header>
      <p class="kindness" data-i18n="kindness" data-i18n-html="true">✨ Kind words come back to you.<br />Positive conversations bring blessings.</p>
      <div id="startCard" class="start-card">
        <p data-i18n="startDesc" data-i18n-html="true">When you want to chat,<br />click to get randomly matched.</p>
        <button type="button" id="matchBtn" class="btn-match" data-i18n="matchBtn">🎲 Start Matching</button>
      </div>
      <div id="status" class="status" style="display:none"></div>
      <div id="chatHeader" class="chat-header" style="display:none">
        <span class="chat-header-text" data-i18n="chatting">In chat</span>
        <button type="button" id="reportBtn" class="btn-report" data-i18n="reportBtn">⚠️ Report</button>
      </div>
      <div id="chatArea" class="chat-area" style="display:none"></div>
      <div id="inputRow" class="input-row" style="display:none">
        <input type="text" id="input" placeholder="" data-i18n-placeholder="placeholderMsg" maxlength="500" autocomplete="off" />
        <button type="button" id="sendBtn" data-i18n="send">Send</button>
      </div>
      <button type="button" id="nextBtn" class="btn-next" style="display:none" data-i18n="nextBtn">Find another</button>
    </div>
    <footer>
      <a href="https://funnyfunny.cloud" target="_blank" rel="noopener" class="footer-link" data-i18n="footerLink">✨ Other services</a>
    </footer>
    <script src="config.js"></script>
    <script>
      const LANG="en";
      const STR={ko:{},en:{title:"Random Chat",tagline:"1:1 anonymous chat with random strangers",kindness:"✨ Kind words come back to you.<br />Positive conversations bring blessings.",startDesc:"When you want to chat,<br />click to get randomly matched.",matchBtn:"🎲 Start Matching",chatting:"In chat",reportBtn:"⚠️ Report",reported:"Reported",placeholderMsg:"Type a message",send:"Send",nextBtn:"Find another",footerLink:"✨ Other services",matching:"Matching... ",sec:"s",matched:"Connected!",partnerLeft:"Partner left",disconnected:"Disconnected (code: ",disconnectedEnd:"). Refresh or click Start Matching.",connectFail:"Connection failed: ",connectError:"Connection error. Check console."}};
      function t(k){return STR.en[k]||k}
      function initI18n(){document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.getAttribute("data-i18n");el.hasAttribute("data-i18n-html")?el.innerHTML=t(k):el.textContent=t(k)});document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{el.placeholder=t(el.getAttribute("data-i18n-placeholder"))})}
      document.addEventListener("DOMContentLoaded",initI18n);
      (function(){
        const statusEl=document.getElementById("status"),startCard=document.getElementById("startCard"),matchBtn=document.getElementById("matchBtn"),chatArea=document.getElementById("chatArea"),inputRow=document.getElementById("inputRow"),input=document.getElementById("input"),sendBtn=document.getElementById("sendBtn"),nextBtn=document.getElementById("nextBtn"),chatHeader=document.getElementById("chatHeader"),reportBtn=document.getElementById("reportBtn");
        let ws=null,matched=false,intentionalReconnect=false,messageHistory=[],waitStartTime=0,waitInterval=null;
        function escapeHtml(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
        function setStatus(text,klass){if(waitInterval){clearInterval(waitInterval);waitInterval=null}statusEl.innerHTML=escapeHtml(text);statusEl.className="status "+(klass||"");statusEl.style.display="block"}
        function setStatusWaiting(){waitStartTime=Date.now();if(waitInterval)clearInterval(waitInterval);statusEl.innerHTML='<span class="spinner"></span><span class="status-text">'+t("matching")+'<span id="waitSec">0</span>'+t("sec")+"</span>";statusEl.className="status waiting";statusEl.style.display="block";const secEl=document.getElementById("waitSec");function update(){if(secEl)secEl.textContent=Math.floor((Date.now()-waitStartTime)/1000)}update();waitInterval=setInterval(update,1000)}
        function hideStatus(){if(waitInterval){clearInterval(waitInterval);waitInterval=null}statusEl.style.display="none"}
        function addMsg(text,isSelf,ts){chatArea.style.display="block";messageHistory.push({text,isSelf,ts:ts||Date.now()});if(messageHistory.length>30)messageHistory.shift();const div=document.createElement("div");div.className="msg "+(isSelf?"self":"other");const time=ts?new Date(ts).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"}):"";div.innerHTML='<div class="bubble">'+escapeHtml(text)+'</div><div class="ts">'+time+"</div>";chatArea.appendChild(div);chatArea.scrollTop=chatArea.scrollHeight}
        function connect(){if(ws&&ws.readyState===1)return;matched=false;startCard.style.display="none";nextBtn.style.display="none";setStatusWaiting();statusEl.className="status waiting";statusEl.style.display="block";chatArea.style.display="none";chatArea.innerHTML="";chatHeader.style.display="none";inputRow.style.display="none";messageHistory=[];reportBtn.classList.remove("reported");reportBtn.textContent=t("reportBtn");const url=typeof getWsUrl==="function"?getWsUrl():"wss://chat-em45.onrender.com/ws";try{ws=new WebSocket(url)}catch(e){setStatus(t("connectFail")+e.message,"disconnected");startCard.style.display="block";matchBtn.disabled=false;return}
        ws.onopen=()=>{setStatusWaiting();statusEl.className="status waiting";statusEl.style.display="block"};
        ws.onmessage=e=>{try{const msg=JSON.parse(e.data);if(msg.type==="waiting"){setStatusWaiting();statusEl.className="status waiting";statusEl.style.display="block"}else if(msg.type==="matched"){matched=true;messageHistory=[];setStatus(t("matched"),"matched");chatHeader.style.display="flex";inputRow.style.display="flex";input.focus()}else if(msg.type==="chat")addMsg(msg.text||"",false,msg.ts);else if(msg.type==="partner_left"){setStatus(t("partnerLeft"),"disconnected");chatHeader.style.display="none";inputRow.style.display="none";nextBtn.style.display="block"}}catch(err){}};
        ws.onclose=e=>{if(!intentionalReconnect){setStatus(t("disconnected")+e.code+t("disconnectedEnd"),"disconnected");chatHeader.style.display="none";inputRow.style.display="none";nextBtn.style.display="block";startCard.style.display="block";matchBtn.disabled=false}};
        ws.onerror=()=>setStatus(t("connectError"),"disconnected")}
        function send(){const text=(input.value||"").trim();if(!text||!ws||ws.readyState!==1||!matched)return;ws.send(JSON.stringify({type:"chat",text}));addMsg(text,true,Date.now());input.value=""}
        matchBtn.addEventListener("click",()=>{matchBtn.disabled=true;connect()});
        sendBtn.addEventListener("click",send);
        input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
        nextBtn.addEventListener("click",()=>{intentionalReconnect=true;if(ws){ws.close();ws=null}intentionalReconnect=false;nextBtn.style.display="none";startCard.style.display="block";matchBtn.disabled=false;hideStatus()});
        reportBtn.addEventListener("click",()=>{if(reportBtn.classList.contains("reported"))return;if(!ws||ws.readyState!==1||!matched)return;const recent=messageHistory.slice(-20).map(m=>(m.isSelf?"[Me] ":"[Them] ")+m.text);ws.send(JSON.stringify({type:"report",reason:"Inappropriate",recentMessages:recent}));reportBtn.classList.add("reported");reportBtn.textContent=t("reported")});
      })();
    </script>
  </body>
</html>
